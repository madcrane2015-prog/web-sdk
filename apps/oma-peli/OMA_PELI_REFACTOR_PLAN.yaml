schema_version: 1
document_type: oma_peli_refactor_plan
status: active
created: '2026-07-05'
last_updated: '2026-07-05'
master_document: 'apps/oma-peli/OMA_PELI_TECHNICAL_DEEP_DIVE.md'
agent_rules: 'apps/oma-peli/AGENTS.md'
phase_runner: 'apps/oma-peli/agentic-refactor/Invoke-OmaPeliCopilotRefactor.ps1'

purpose:
  summary: >-
    Refactor oma-peli from the current monolithic, locally simulated HelloPixi
    implementation into a maintainable, mobile-stable, agent-friendly game system.
  main_problem: >-
    The deployed route uses PasswordProtection -> HelloPixi, while Storybook uses
    the separate SDK Game.svelte path. HelloPixi owns rendering, math, audio,
    controls, layout, and debug tools in one file. The UI is especially fragile on
    mobile because layout is controlled by mixed inline styles, media queries,
    gameScale math, and device-specific config that is not fully reactive.
  explicit_non_goal_for_first_pass: >-
    Do not rewrite the full game into the SDK/RGS BookEvent pipeline before the
    standalone HelloPixi behavior has been stabilized, covered, and split into
    smaller modules. The SDK migration is a later decision phase.

source_investigation:
  required_reading_order:
    - 'apps/oma-peli/AGENTS.md'
    - 'apps/oma-peli/OMA_PELI_TECHNICAL_DEEP_DIVE.md'
    - 'apps/oma-peli/OMA_PELI_REFACTOR_PLAN.yaml'
    - 'apps/oma-peli/src/routes/+page.svelte'
    - 'apps/oma-peli/src/components/HelloPixi.svelte'
    - 'apps/oma-peli/src/config/layoutConfig.ts'
    - 'apps/oma-peli/src/utils/layoutUtils.ts'
  online_references_used:
    - name: 'VS Code agent customization docs'
      url: 'https://code.visualstudio.com/docs/copilot/copilot-customization'
      relevant_points:
        - 'Use project instructions, path-specific instructions, custom agents, skills, and hooks incrementally.'
        - 'Use monorepo-aware customization files and nearest applicable instructions.'
        - 'Evaluate customization files for contradictions when they grow.'
    - name: 'GitHub Copilot repository custom instructions'
      url: 'https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions'
      relevant_points:
        - 'Repository instructions live in .github/copilot-instructions.md.'
        - 'Path-specific instructions use .github/instructions/*.instructions.md with applyTo frontmatter.'
        - 'AGENTS.md files can live anywhere; the nearest one takes precedence for agents.'
    - name: 'AGENTS.md convention'
      url: 'https://agents.md/'
      relevant_points:
        - 'AGENTS.md is a README for agents with build, test, style, security, and workflow details.'
        - 'Nested AGENTS.md files are recommended for monorepos so each subproject can carry tailored instructions.'
        - 'Treat AGENTS.md as living documentation.'

global_agent_contract:
  before_any_code_change:
    - 'Read master_document and this plan.'
    - 'Identify whether the task targets active_deployed_hellopixi, sdk_storybook_shell, or shared_docs_only.'
    - 'Pick exactly one phase and one step unless the user explicitly asks for a broader batch.'
    - 'Record the intended step in progress.active_step before editing.'
    - 'Use apply_patch for manual edits.'
  after_each_substantive_change:
    - 'Run the narrowest available validation for the touched files.'
    - 'Update this YAML: mark completed steps, add notes, add blockers, and update last_updated.'
    - 'Update the master document if new architecture facts, commands, asset behavior, bugs, or decisions were found.'
    - 'If a change affects agent workflow, update AGENTS.md too.'
  documentation_update_rule: >-
    Documentation is part of the refactor output. A phase is not complete until
    OMA_PELI_TECHNICAL_DEEP_DIVE.md and this YAML reflect what changed and what
    was learned.
  validation_priority:
    - 'get_errors for directly touched Svelte/TypeScript files'
    - 'pnpm run build --filter=oma-peli'
    - 'pnpm run lint --filter=oma-peli'
    - 'manual browser/dev-server checks for layout and interaction'
    - 'Storybook checks only for SDK Game.svelte changes'
  never_do:
    - 'Do not treat Storybook passing as proof that the deployed HelloPixi route works.'
    - 'Do not change math constants and UI layout in the same step.'
    - 'Do not migrate to RGS/BookEvents before the standalone behavior is documented and covered.'
    - 'Do not delete existing deployment folders or generated outputs unless explicitly requested.'
    - 'Do not rewrite unrelated Web SDK packages during oma-peli UI cleanup.'

current_findings:
  active_route:
    fact: 'src/routes/+page.svelte renders PasswordProtection, then HelloPixi.'
    implication: 'Most user-visible bugs are likely in HelloPixi or its direct children.'
  storybook_route:
    fact: 'Storybook renders Game.svelte and the SDK BookEvent path.'
    implication: 'Storybook does not currently validate deployed HelloPixi UI/mobile behavior.'
  diagnostics_seen:
    - file: 'apps/oma-peli/src/components/HelloPixi.svelte'
      issue: 'Svelte 5 reports many deprecated on:event directives.'
      first_fix_phase: 'phase_01_baseline_and_compile_hygiene'
    - file: 'apps/oma-peli/src/components/HelloPixi.svelte'
      issue: 'Icon-only buttons lack aria-label or aria-labelledby.'
      first_fix_phase: 'phase_01_baseline_and_compile_hygiene'
    - file: 'apps/oma-peli/src/components/HelloPixi.svelte'
      issue: 'Unused CSS selectors such as .win3d are reported.'
      first_fix_phase: 'phase_01_baseline_and_compile_hygiene'
    - file: 'apps/oma-peli/src/components/HelloPixi.svelte'
      issue: 'Mobile menu references autoPlayRounds, but state variable is autoPlayRoundsLeft.'
      first_fix_phase: 'phase_01_baseline_and_compile_hygiene'
    - file: 'apps/oma-peli/src/components/HelloPixi.svelte'
      issue: 'layoutUpdateTrigger is used to derive layout/device type, but resizeGame does not increment it.'
      first_fix_phase: 'phase_02_layout_state_repair'
    - file: 'apps/oma-peli/static/music'
      issue: 'Music randomizer expects loop numbers 1 through 20, but loop 14 is missing from static/music.'
      first_fix_phase: 'phase_07_assets_and_audio'

target_architecture:
  short_term: 'A modular standalone HelloPixi game that still renders through +page.svelte but has separated math, layout, Pixi lifecycle, controls, audio, and debug modules.'
  medium_term: 'A responsive UI shell with mobile-first controls, stable safe-area sizing, accessible buttons, and screenshot/manual validation across desktop, mobile portrait, and mobile landscape.'
  long_term_decision: 'Choose whether to keep the standalone local game for demo use or migrate the game into the SDK BookEvent/RGS path.'
  proposed_modules:
    - path: 'src/game-standalone/types.ts'
      responsibility: 'Shared SymbolKey, WinResult, ReelState, GameMode, SpinSpeed, layout and UI state types for HelloPixi-derived code.'
    - path: 'src/game-standalone/mathConfig.ts'
      responsibility: 'Runtime symbol weights, paytable, multipliers, bet levels, scatter/free-spin rules.'
    - path: 'src/game-standalone/math.ts'
      responsibility: 'Pure functions for random symbol selection, reel-position mapping, path generation, win calculation, and payout calculation.'
    - path: 'src/game-standalone/reel.ts'
      responsibility: 'Pixi Reel class or factory with no Svelte state and no UI overlay knowledge.'
    - path: 'src/game-standalone/audio.ts'
      responsibility: 'HTMLAudio and Howler music orchestration with asset manifest and missing-file safeguards.'
    - path: 'src/game-standalone/assets.ts'
      responsibility: 'Centralized asset URLs derived from SvelteKit base without GitHub hostname branching unless documented.'
    - path: 'src/game-standalone/layout.ts'
      responsibility: 'Viewport, safe-area, canvas scale, control panel placement, and device/orientation helpers.'
    - path: 'src/components/standalone/ControlPanel.svelte'
      responsibility: 'Bet, play, autoplay, speed, menu, and win display controls with responsive markup.'
    - path: 'src/components/standalone/GameOverlay.svelte'
      responsibility: 'Paytable/menu, win popup, free-spin outro, debug panel, and modal overlays.'

