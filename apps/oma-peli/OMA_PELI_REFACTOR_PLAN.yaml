phases:
  - id: 'phase_00_workflow_and_docs'
    status: 'completed'
    priority: 0
    goal: 'Establish agent workflow, documentation discipline, and decision boundaries before touching game behavior.'
    why: 'The project is already split between deployed HelloPixi and SDK Storybook paths. Future agents must not blur those paths.'
    target_path: 'shared_docs_only'
    steps:
      - id: '00.01_read_context'
        status: 'completed'
        action: 'Read AGENTS.md, OMA_PELI_TECHNICAL_DEEP_DIVE.md, and this YAML.'
        output: 'Agent can state which implementation path it is changing.'
        validation: 'No code validation required.'
      - id: '00.02_set_scope'
        status: 'completed'
        action: 'Set progress.active_phase and progress.active_step in this YAML before editing code.'
        output: 'This plan records the current working scope.'
        validation: 'git diff shows only the intended progress metadata change before code edits.'
      - id: '00.03_update_docs_contract'
        status: 'completed'
        action: 'After each phase, add discoveries to master_document and progress notes to this YAML.'
        output: 'Living docs remain synchronized with implementation.'
        validation: 'git diff includes doc updates with the code phase.'
    phase_notes:
      - date: '2026-07-05'
        note: >-
          This phase made no game runtime changes. Future execution should target
          one implementation path at a time: active_deployed_hellopixi for
          +page.svelte -> PasswordProtection -> HelloPixi, sdk_storybook_shell
          for Game.svelte/src/game Storybook work, or shared_docs_only for plan
          and agent-instruction updates.
      - date: '2026-07-05'
        note: >-
          gh copilot -p could read/search the repository but file-edit operations
          were denied in the attempted non-interactive run, even after broad tool
          allowance. Use this VS Code agent workflow for queued phase execution.

  - id: 'phase_01_baseline_and_compile_hygiene'
    status: 'completed'
    priority: 1
    goal: 'Make the current HelloPixi file cleaner to compile and easier to refactor without changing behavior.'
    why: 'Current diagnostics create noise that will obscure real refactor regressions.'
    target_files:
      - 'src/components/HelloPixi.svelte'
      - 'src/components/PasswordProtection.svelte'
      - 'src/components/LoadingScreen.svelte'
    steps:
      - id: '01.01_capture_baseline_errors'
        status: 'completed'
        action: 'Run get_errors on HelloPixi.svelte, layoutConfig.ts, layoutUtils.ts, PasswordProtection.svelte, and LoadingScreen.svelte.'
        output: 'List of current compile/a11y warnings is recorded in this YAML under current_findings or a phase note.'
        validation: 'No edits yet.'
      - id: '01.02_fix_svelte_event_directives'
        status: 'completed'
        action: 'Convert deprecated on:click, on:mouseenter, on:mouseleave, and on:keydown in HelloPixi-facing components to Svelte 5 event attributes.'
        details:
          - 'Use onclick={handler} instead of on:click={handler}.'
          - 'Use onmouseenter and onmouseleave for hover handlers.'
          - 'Do not change handler bodies except when extracting repeated functions is necessary for readability.'
        output: 'Deprecated event directive diagnostics are gone or materially reduced.'
        validation: 'Run get_errors on touched files.'
      - id: '01.03_add_accessible_labels'
        status: 'completed'
        action: 'Add aria-label to icon-only buttons in HelloPixi controls and audio toggles.'
        details:
          - 'Keep existing title attributes if present.'
          - 'Labels must describe action, such as Increase bet, Decrease bet, Spin, Stop autoplay, Toggle menu, Toggle music, Toggle sound.'
        output: 'a11y_consider_explicit_label diagnostics are gone or materially reduced.'
        validation: 'Run get_errors on HelloPixi.svelte.'
      - id: '01.04_fix_obvious_identifier_bug'
        status: 'completed'
        action: 'Replace mobile menu reference to autoPlayRounds with autoPlayRoundsLeft.'
        output: 'Mobile autoplay status displays the correct state variable.'
        validation: 'Run get_errors on HelloPixi.svelte.'
      - id: '01.05_remove_or_reconnect_unused_css'
        status: 'completed'
        action: 'Remove unused .win3d CSS selectors or reconnect them if they are meant to style the current win label.'
        decision_rule: 'Prefer removal unless a visible current element uses the class after a small local read.'
        output: 'Unused CSS warnings shrink.'
        validation: 'Run get_errors on HelloPixi.svelte.'
      - id: '01.06_build_baseline'
        status: 'completed'
        action: 'Run pnpm run build --filter=oma-peli.'
        output: 'Known build status is recorded in this YAML.'
        validation: 'Build succeeds, or failure is logged with exact error and next local step.'
    phase_notes:
      - date: '2026-07-05'
        note: >-
          Baseline get_errors initially reported the planned mobile autoplay
          identifier issue, icon-only button labels, unused CSS selectors, and
          two local nullability errors in HelloPixi. After the phase edits,
          get_errors reported no errors for HelloPixi.svelte,
          LoadingScreen.svelte, PasswordProtection.svelte, layoutConfig.ts, and
          layoutUtils.ts.
      - date: '2026-07-05'
        note: >-
          Build validation passed with pnpm run build --filter=oma-peli. Existing
          warnings remain: tsconfig should extend ./.svelte-kit/tsconfig.json,
          PUBLIC_SITE_MODE/PUBLIC_SENTRY_DSN/PUBLIC_CHROMATIC are not exported
          by virtual:env/static/public, and TextStyle is imported but unused in
          the bundle graph.
    documentation_required:
      - 'Update master_document Risks And Maintenance Notes if diagnostics reveal new categories.'
      - 'Update this phase status and agent_journal.'

  - id: 'phase_02_layout_state_repair'
    status: 'completed'
    priority: 2
    goal: 'Make device type, orientation, canvas scale, and control panel placement reactive and predictable.'
    why: 'Mobile bugs are likely caused by mixed CSS media queries, non-reactive device detection, and fixed 1445x1000 assumptions.'
    target_files:
      - 'src/config/layoutConfig.ts'
      - 'src/utils/layoutUtils.ts'
      - 'src/components/HelloPixi.svelte'
    steps:
      - id: '02.01_define_viewport_model'
        status: 'completed'
        action: 'Add or document a single viewport model with width, height, isMobile, isPortrait, safeAreaInsets, deviceType, and gameScale.'
        output: 'One helper owns device/orientation decisions.'
        validation: 'Typecheck touched TypeScript files through get_errors.'
      - id: '02.02_fix_layout_update_trigger'
        status: 'completed'
        action: 'Increment layoutUpdateTrigger inside resizeGame or replace it with a state object updated by the resize listener.'
        output: 'currentLayout() and deviceType() recompute when viewport/orientation changes.'
        validation: 'Manual dev-server check by resizing browser and logging deviceType/currentLayout from debug panel or console.'
      - id: '02.03_remove_duplicate_scale_logic'
        status: 'completed'
        action: 'Move resizeGame scale calculation into layoutUtils or a new standalone layout module.'
        details:
          - 'Keep existing numeric behavior first.'
          - 'Only after behavior is preserved, simplify mobile portrait and landscape scale constants.'
        output: 'HelloPixi calls a helper instead of owning long viewport math inline.'
        validation: 'Build and manual desktop/mobile viewport smoke check.'
      - id: '02.04_safe_area_support'
        status: 'completed'
        action: 'Add CSS variables or style calculations for iOS safe-area insets around top buttons and bottom control panel.'
        output: 'Top-right buttons and bottom controls avoid notches/home indicator.'
        validation: 'Manual check using browser mobile emulation for iPhone portrait and landscape.'
      - id: '02.05_document_layout_truth'
        status: 'completed'
        action: 'Update OMA_PELI_TECHNICAL_DEEP_DIVE.md with the actual final layout model.'
        output: 'Master document no longer warns that layoutUpdateTrigger is stale if fixed.'
        validation: 'Diff confirms docs reflect code.'
    phase_notes:
      - date: '2026-07-05'
        note: >-
          layoutUtils now owns ViewportModel creation, safe-area inset reading,
          and the preserved gameScale formula. HelloPixi assigns a fresh
          viewportModel on resize, increments layoutUpdateTrigger, and then uses
          viewportModel.gameScale for Pixi stage scaling.
      - date: '2026-07-05'
        note: >-
          Safe-area support is intentionally conservative: when CSS env-derived
          safe-area variables are zero, existing positions are unchanged. When
          present, top-right buttons are offset from top/right insets and the
          control panel is shifted upward from the bottom inset.
      - date: '2026-07-05'
        note: >-
          Manual browser validation for desktop resize, mobile portrait, and
          mobile landscape remains recommended because no shared browser page was
          available in this run.

  - id: 'phase_03_extract_runtime_config_and_math'
    status: 'completed'
    priority: 3
    goal: 'Move symbol keys, assets, weights, paytable, bet levels, multipliers, and win math out of HelloPixi into pure modules.'
    why: 'Math and UI changes are currently tangled, making regressions likely and making simulator/docs drift.'
    target_new_files:
      - 'src/game-standalone/types.ts'
      - 'src/game-standalone/mathConfig.ts'
      - 'src/game-standalone/math.ts'
    steps:
      - id: '03.01_create_types_module'
        status: 'completed'
        action: 'Move SymbolKey, WinResult, SpinSpeed, reel position types, and GameMode-like standalone types to game-standalone/types.ts.'
        output: 'HelloPixi imports types without changing runtime behavior.'
        validation: 'get_errors on HelloPixi.svelte and new TypeScript file.'
      - id: '03.02_create_math_config'
        status: 'completed'
        action: 'Move SYMBOL_KEYS, SYMBOL_WEIGHTS_BASE, SYMBOL_WEIGHTS_FS, SYMBOL_PAYTABLE, BET_LEVELS, and multiplier distribution into mathConfig.ts.'
        output: 'One runtime config module becomes source of truth for docs and future simulator alignment.'
        validation: 'Build or get_errors.'
      - id: '03.03_extract_coordinate_helpers'
        status: 'completed'
        action: 'Move getReelPosition and getReelIndex into pure math.ts with unit-like inline assertions or small test helpers if local test framework exists.'
        output: 'Coordinate mapping can be reused by render and win math.'
        validation: 'Add cheap script or console-free function checks if test framework is unavailable.'
      - id: '03.04_extract_random_symbol'
        status: 'completed'
        action: 'Move randomSymbol into math.ts and pass dependencies explicitly: reelIndex, isFreeSpinMode, rng.'
        output: 'Math becomes deterministic under injected rng.'
        validation: 'Create a small development-only smoke script or Storybook/debug hook only if existing patterns allow it.'
      - id: '03.05_extract_check_wins'
        status: 'completed'
        action: 'Move checkWins into a pure calculateWins function that accepts reelData, betAmount, isFreeSpinMode, and rng/multiplier provider.'
        details:
          - 'Do not mutate freeSpinsRemaining inside pure win calculation.'
          - 'Return scatter trigger metadata separately from paying wins.'
          - 'Keep payout parity with current behavior first.'
        output: 'HelloPixi handles state transitions; math module returns calculation results.'
        validation: 'Run a known reelData fixture before and after extraction and record matching results.'
      - id: '03.06_update_docs'
        status: 'completed'
        action: 'Update master_document to list new modules and mark mathConfig.ts as current runtime truth.'
        output: 'Future agents stop treating HelloPixi as the only source of math truth.'
        validation: 'Diff confirms references are updated.'
    phase_notes:
      - date: '2026-07-05'
        note: >-
          Extracted standalone math without changing payout constants: SYMBOL_KEYS
          and shared runtime types live in types.ts; BET_LEVELS, base/free-spin
          weights, paytable, and multiplier distributions live in mathConfig.ts;
          randomSymbol, getReelPosition, getReelIndex, getWinMultiplier, and
          calculateWins live in math.ts.
      - date: '2026-07-05'
        note: >-
          calculateWins is pure with respect to Svelte state. It accepts reelData,
          betAmount, isFreeSpinMode, and an optional rng, and returns wins plus
          scatterTrigger metadata. HelloPixi.checkWins applies free-spin counter
          mutations and music switching around that result.
      - date: '2026-07-05'
        note: >-
          Validation: get_errors passed for HelloPixi.svelte and the three new
          game-standalone modules; pnpm run build --filter=oma-peli passed with
          the known warnings about SvelteKit tsconfig, missing virtual public env
          exports, and TextStyle import. Attempted a deterministic fixture smoke
          command with pnpm exec tsx, but tsx is not installed in the workspace.
          Add a test runner or package-level script before relying on direct TS
          fixture checks.

  - id: 'phase_04_extract_pixi_reel_runtime'
    status: 'not_started'
    priority: 4
    goal: 'Move Pixi reel animation and texture drawing concerns out of HelloPixi.'
    why: 'The Reel class currently mixes animation state, random symbol generation, sound triggers, and direct stage drawing.'
    target_new_files:
      - 'src/game-standalone/reel.ts'
      - 'src/game-standalone/pixiRuntime.ts'
    steps:
      - id: '04.01_extract_reel_class'
        status: 'not_started'
        action: 'Move Reel into reel.ts with constructor dependencies for texture lookup, randomSymbol callback, dimensions, and callbacks for stop events.'
        output: 'Reel no longer closes over HelloPixi state except through callbacks.'
        validation: 'get_errors and one manual spin.'
      - id: '04.02_reduce_sprite_churn'
        status: 'not_started'
        action: 'Investigate whether draw() removeChildren/addChild every frame is causing mobile performance issues; if yes, reuse sprites and swap textures.'
        output: 'Mobile frame stability improves or documented reason to defer.'
        validation: 'Manual mobile-emulation spin check and console performance observation.'
      - id: '04.03_extract_pixi_setup'
        status: 'not_started'
        action: 'Move Application init, asset loading, masks, frames, logo setup, and cleanup into a runtime helper or Svelte action.'
        output: 'HelloPixi onMount becomes orchestration rather than detailed Pixi construction.'
        validation: 'Build and manual load/spin check.'
      - id: '04.04_add_cleanup'
        status: 'not_started'
        action: 'Ensure resize and keydown listeners are removed and Pixi app is destroyed on component teardown.'
        output: 'Hot reload and navigation do not leak listeners/canvases.'
        validation: 'Manual dev-server reload check; no duplicate spin handlers.'

