        output: 'HelloPixi renders named components instead of long inline overlay blocks.'
        validation: 'Manual checks for all overlays.'
      - id: '05.06_css_module_or_global_style_decision'
        status: 'not_started'
        action: 'Choose component-scoped Svelte styles for standalone UI; remove repeated inline styles where practical.'
        output: 'UI styles become readable and mobile-specific without !important-heavy overrides.'
        validation: 'get_errors for unused CSS and build.'

