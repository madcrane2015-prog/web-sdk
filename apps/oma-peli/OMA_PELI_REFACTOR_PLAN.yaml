    - id: 'RQ-002'
      question: 'Should Howler be installed as a package dependency instead of loaded from CDN?'
      default_until_answered: 'Keep CDN but isolate it behind audio.ts and document the tradeoff.'
    - id: 'RQ-003'
      question: 'Should debug UI be hidden behind query param, build flag, or kept visible with the debug button?'
      default_until_answered: 'Keep visible for development, but make it non-overlapping and mobile-safe.'
    - id: 'RQ-004'
      question: 'Can the missing music loop 14 be added, or should the random music manifest exclude it?'
      default_until_answered: 'Exclude missing files from random selection.'

