name: Deploy oma-peli to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: 
      - 'apps/oma-peli/**'
      - '.github/workflows/deploy-oma-peli.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-oma-peli"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: https://madcrane2015-prog.github.io/web-sdk/oma-peli
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'pnpm'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build pixi-svelte
        run: pnpm run build --filter=pixi-svelte
        
      - name: Build oma-peli
        run: pnpm run build --filter=oma-peli
          
      - name: Verify symbols in build
        run: |
          ls -la apps/oma-peli/build/symbols/ || echo "Symbols directory not found"
          
      - name: Copy symbols to build directory (if missing)
        run: |
          if [ ! -d "apps/oma-peli/build/symbols" ]; then
            echo "Symbols directory missing, copying manually..."
            mkdir -p apps/oma-peli/build/symbols
            cp -r apps/oma-peli/static/symbols/* apps/oma-peli/build/symbols/
          else
            echo "Symbols directory already exists"
          fi
        
      - name: Deploy to GitHub Pages  
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./apps/oma-peli/build
          target-folder: oma-peli
          branch: gh-pages
          clean: false