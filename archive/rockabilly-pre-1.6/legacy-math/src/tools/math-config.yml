# =====================================================================
# FREE SPINS
# =====================================================================
free_spins:
  enabled: true
  trigger_symbol: "l"
  min_scatter_count: 5

  scatter_fs_awards:
    "5": 5
    "6": 6
    "7": 7
    "8": 8
    "9": 9
    "10": 10
    "11": 11
    "12": 12

  use_fs_symbol_weights: false
  fs_outer_reels_weights: {}
  fs_center_reel:
    wild_probability: 0.55
    empty_probability: 0.45
  fs_symbol_replacements:
    enabled: true
    replacement_map:
      k: "f"
      j: "e"
      i: "g"

# =====================================================================
# MULTIPLIERS (NYT KÄYTÖSSÄ)
# =====================================================================
# Tämä tekee juuri sen mitä pyysit:
# - base_game: jokaiseen maksettuun spiniin arvotaan multiplier (1x/2x/3x…)
# - free_spins: jokaiseen vapaaspiniin arvotaan multiplier (3x/5x/10x…)
#
# Todennäköisyydet voivat olla mitä tahansa suhteellisia painoja.
# (Ei tarvitse summata 1.0:aan, normalisoidaan automaattisesti.)
multipliers:
  enabled: true

  base_game:
    distribution:
      "1": 0.70
      "2": 0.22
      "3": 0.08

  free_spins:
    distribution:
      "3": 0.70
      "5": 0.22
      "10": 0.08

# =====================================================================
# SIMULATION DEFAULTS
# =====================================================================
simulation:
  default_spins: 1000000
  rng_seed: random

  debug:
    log_big_wins_over_x: 50.0
    log_big_wins_over_x: 100.0
    log_big_wins_over_x: 1000.0
    track_max_win: true
    track_hit_frequency: true
    track_fs_frequency: true
    track_symbol_win_stats: true
